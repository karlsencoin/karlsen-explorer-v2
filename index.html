<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0C1622" />
    <meta name="description" content="Karlsen BlockDAG explorer: blocks, transactions, addresses and network statistics." />
    <title>Karlsen Explorer</title>
    <link rel="icon" href="/karlsen-logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/karlsen-logo.png" />
    <script>
      // Apply the saved theme before first paint (no dark/light flash).
      try {
        if (localStorage.getItem("kls_theme") === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
